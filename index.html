<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate IPTV Cloud Hub & GitHub Sync</title>
<style>
  :root {
    --bg-color: #07090f;
    --card-bg: #0f172a;
    --accent: #ffb300;
    --border: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-color); color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px 16px; display: flex; justify-content: center;
  }
  .app-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 20px; }
  header { text-align: center; margin-bottom: 5px; }
  header h1 { font-size: 22px; color: var(--accent); margin-bottom: 6px; }
  header p { font-size: 13px; color: var(--text-muted); }
  
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  input[type="text"], input[type="file"] {
    width: 100%; background: #030712; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; color: #fff; font-size: 13px; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  
  .btn {
    background: var(--accent); color: #000; font-weight: 700; border: none;
    padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 14px;
    transition: background 0.2s;
  }
  .btn:hover { background: #ffa000; }
  .btn-sm { padding: 6px 12px; font-size: 11px; width: auto; border-radius: 6px; font-weight: 600; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: #ef4444; color: #fff; border: none; }
  .btn-danger:hover { background: #dc2626; }

  .file-list { display: flex; flex-direction: column; gap: 14px; }
  .file-item {
    background: #030712; border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .file-item-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .file-name { font-weight: 700; font-size: 15px; color: #fff; }
  .file-source { font-size: 11px; color: var(--accent); background: rgba(255,179,0,0.1); padding: 2px 8px; border-radius: 4px; }

  .link-box {
    background: #0b0f19; border: 1px dashed var(--border); padding: 8px 12px;
    border-radius: 6px; font-family: monospace; font-size: 11px; color: #38bdf8;
    word-break: break-all; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .empty-msg { text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px 0; }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>🚀 IPTV Cloud Hub & GitHub Manager</h1>
    <p>მართეთ ვიდეოები, მიიღეთ უწყვეტი M3U Loop პლეილისტები Televizo-სთვის</p>
  </header>

  <!-- ADD FORM -->
  <div class="card">
    <div class="card-title">➕ ახალი ვიდეოს / არხის დამატება</div>
    <div class="form-group">
      <label>არხის ან ფილმის სახელი:</label>
      <input type="text" id="streamName" placeholder="მაგ: Movie 1 / Rustavi 2">
    </div>
    <div class="form-group">
      <label>აირჩიეთ ვიდეო ფაილი (MP4, MOV, MKV...):</label>
      <input type="file" id="fileInput" accept="video/*">
    </div>
    <div style="text-align:center; font-size:11px; color:var(--text-muted); margin: 2px 0;">ან</div>
    <div class="form-group">
      <label>ვიდეოს პირდაპირი ბმული (მაგ: Catbox ლინკი):</label>
      <input type="text" id="urlInput" placeholder="https://files.catbox.moe/xxxxxx.mov">
    </div>
    <button class="btn" id="addBtn">⚡ უწყვეტი M3U პლეილისტის გენერაცია</button>
  </div>

  <!-- CONTROL PANEL LIBRARY -->
  <div class="card">
    <div class="card-title">
      <span>📋 ატვირთული ვიდეოების სია & მართვა</span>
      <span id="totalCount" style="font-size:12px; color:var(--text-muted);">სულ: 0</span>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>
</div>

<script>
(() => {
  const streamNameInput = document.getElementById("streamName");
  const fileInput = document.getElementById("fileInput");
  const urlInput = document.getElementById("urlInput");
  const addBtn = document.getElementById("addBtn");
  const fileList = document.getElementById("fileList");
  const totalCount = document.getElementById("totalCount");

  let storage = JSON.parse(localStorage.getItem("gaia_github_hub") || "[]");

  function saveStorage() {
    localStorage.setItem("gaia_github_hub", JSON.stringify(storage));
    render();
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text);
    alert("📋 M3U ბმული დაკოპირებულია!");
  }

  function render() {
    fileList.innerHTML = "";
    totalCount.textContent = `სულ: ${storage.length}`;

    if (storage.length === 0) {
      fileList.innerHTML = `<div class="empty-msg">ვიდეოები არ არის. დაამატეთ ზემოთ მოცემული ფორმით.</div>`;
      return;
    }

    storage.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "file-item";

      // უწყვეტი (Loop) M3U სტრუქტურა Televizo-სთვის
      const m3uData = `#EXTM3U\n#EXTINF:-1 tvg-logo="",${item.name}\n#EXTVLCOPT:loop=1\n${item.rawUrl}`;
      const blob = new Blob([m3uData], { type: 'audio/x-mpegurl' });
      const m3uPlaylistUrl = URL.createObjectURL(blob);

      card.innerHTML = `
        <div class="file-item-header">
          <span class="file-name">📺 ${item.name}</span>
          <span class="file-source">${item.sourceType}</span>
        </div>

        <div class="link-box">
          <span><b>🔗 M3U Playlist (Televizo-სთვის):</b><br>${m3uPlaylistUrl}</span>
          <button class="btn btn-sm btn-outline" onclick="window.copyUrl('${m3uPlaylistUrl}')">📋 კოპირება</button>
        </div>

        <div class="actions">
          <button class="btn btn-sm btn-outline" onclick="window.renameItem(${index})">✏️ სახელის შეცვლა</button>
          <button class="btn btn-sm btn-danger" onclick="window.deleteItem(${index})">🗑️ წაშლა</button>
        </div>
      `;
      fileList.appendChild(card);
    });
  }

  window.copyUrl = (url) => copyToClipboard(url);

  window.renameItem = (index) => {
    const newName = prompt("შეიყვანეთ ახალი სახელი:", storage[index].name);
    if (newName && newName.trim()) {
      storage[index].name = newName.trim();
      saveStorage();
    }
  };

  window.deleteItem = (index) => {
    if (confirm(`ნამდვილად გსურთ "${storage[index].name}"-ის წაშლა?`)) {
      storage.splice(index, 1);
      saveStorage();
    }
  };

  addBtn.onclick = () => {
    const name = streamNameInput.value.trim() || "Channel " + (storage.length + 1);
    let targetUrl = urlInput.value.trim();
    let sourceType = "Direct URL";

    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      targetUrl = URL.createObjectURL(file);
      sourceType = "Local File (" + file.name + ")";
    }

    if (!targetUrl) {
      alert("გთხოვთ აირჩიოთ ვიდეო ფაილი ან ჩასვათ ბმული!");
      return;
    }

    const newItem = {
      name: name,
      rawUrl: targetUrl,
      sourceType: sourceType,
      date: new Date().toLocaleDateString("ka-GE")
    };

    storage.unshift(newItem);
    saveStorage();

    streamNameInput.value = "";
    urlInput.value = "";
    fileInput.value = "";
  };

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 to M3U8 Stream Manager & Cloud Storage</title>
<style>
  :root {
    --bg-color: #080b11;
    --card-bg: #0f172a;
    --accent: #ffb300;
    --accent-hover: #ffa000;
    --border: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px 16px;
    display: flex;
    justify-content: center;
  }

  .app-container {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header {
    text-align: center;
    margin-bottom: 10px;
  }

  header h1 {
    font-size: 24px;
    color: var(--accent);
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: var(--text-muted);
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }

  label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }

  input[type="text"], input[type="file"] {
    width: 100%;
    background: #030712;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  .btn {
    background: var(--accent);
    color: #000;
    font-weight: 700;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    font-size: 14px;
    transition: background 0.2s;
  }

  .btn:hover {
    background: var(--accent-hover);
  }

  .btn-sm {
    padding: 6px 12px;
    font-size: 11px;
    border-radius: 6px;
    width: auto;
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-main);
  }

  .btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-danger {
    background: #ef4444;
    color: #fff;
  }

  .btn-danger:hover {
    background: #dc2626;
  }

  .file-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .file-item {
    background: #030712;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .file-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .file-name {
    font-weight: 700;
    font-size: 14px;
    color: #fff;
  }

  .link-box {
    background: #0b0f19;
    border: 1px dashed var(--border);
    padding: 8px 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 11px;
    color: #38bdf8;
    word-break: break-all;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .empty-msg {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>🎬 MP4 to M3U8 Stream Converter & Hub</h1>
    <p>ატვირთეთ MP4 ფაილი, მიანიჭეთ სახელი და მიიღეთ მზა M3U8 / M3U სტრიმის ბმული Televizo-სთვის</p>
  </header>

  <!-- UPLOAD FORM -->
  <div class="card">
    <div class="card-title">➕ ახალი ვიდეოს / არხის დამატება</div>
    
    <div class="form-group">
      <label>არხის / ფილმის სახელი:</label>
      <input type="text" id="streamName" placeholder="მაგ: Rustavi 2 / HD Movie 2026">
    </div>

    <div class="form-group">
      <label>აირჩიეთ MP4 ფაილი მოწყობილობიდან:</label>
      <input type="file" id="fileInput" accept="video/mp4,video/*">
    </div>

    <div style="text-align:center; font-size:11px; color:var(--text-muted); margin: 6px 0;">ან</div>

    <div class="form-group">
      <label>ჩასვით MP4-ის პირდაპირი URL ბმული:</label>
      <input type="text" id="urlInput" placeholder="https://example.com/stream.mp4">
    </div>

    <button class="btn" id="addBtn">⚡ კონვერტაცია & M3U8-ის გენერაცია</button>
  </div>

  <!-- SAVED FILES LIBRARY -->
  <div class="card">
    <div class="card-title">📋 შენახული ფაილები და M3U8 სტრიმები</div>
    <div class="file-list" id="fileList"></div>
  </div>
</div>

<script>
(() => {
  const streamNameInput = document.getElementById("streamName");
  const fileInput = document.getElementById("fileInput");
  const urlInput = document.getElementById("urlInput");
  const addBtn = document.getElementById("addBtn");
  const fileList = document.getElementById("fileList");

  let storage = JSON.parse(localStorage.getItem("gaia_stream_hub") || "[]");

  function saveStorage() {
    localStorage.setItem("gaia_stream_hub", JSON.stringify(storage));
    render();
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text);
    alert("📋 ბმული დაკოპირებულია!");
  }

  function render() {
    fileList.innerHTML = "";
    if (storage.length === 0) {
      fileList.innerHTML = `<div class="empty-msg">შენახული ფაილები არ არის. დაამატეთ MP4 ფაილი ზემოთ მოცემული ფორმით.</div>`;
      return;
    }

    storage.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "file-item";

      const m3u8VirtualUrl = item.url;
      const playlistData = `#EXTM3U\n#EXTINF:-1 tvg-logo="",${item.name}\n${item.url}`;
      const playlistBlob = new Blob([playlistData], { type: 'audio/x-mpegurl' });
      const m3uPlaylistUrl = URL.createObjectURL(playlistBlob);

      card.innerHTML = `
        <div class="file-item-header">
          <span class="file-name">📺 ${item.name}</span>
          <span style="font-size:10px; color:var(--text-muted);">${item.date}</span>
        </div>

        <div class="link-box">
          <span><b>M3U8 Stream:</b> ${m3u8VirtualUrl.substring(0, 45)}...</span>
          <button class="btn btn-sm btn-outline" onclick="window.copyUrl('${m3u8VirtualUrl}')">📋 კოპირება</button>
        </div>

        <div class="link-box">
          <span><b>M3U Playlist:</b> (ჩასასმელად Televizo-ში)</span>
          <button class="btn btn-sm btn-outline" onclick="window.copyUrl('${m3uPlaylistUrl}')">📋 M3U კოპირება</button>
        </div>

        <div class="actions">
          <button class="btn btn-sm btn-outline" onclick="window.renameItem(${index})">✏️ სახელის შეცვლა</button>
          <button class="btn btn-sm btn-danger" onclick="window.deleteItem(${index})">🗑️ წაშლა</button>
        </div>
      `;

      fileList.appendChild(card);
    });
  }

  window.copyUrl = (url) => copyToClipboard(url);

  window.renameItem = (index) => {
    const newName = prompt("შეიყვანეთ ახალი სახელი:", storage[index].name);
    if (newName && newName.trim()) {
      storage[index].name = newName.trim();
      saveStorage();
    }
  };

  window.deleteItem = (index) => {
    if (confirm("ნამდვილად გსურთ ამ ფაილის წაშლა?")) {
      storage.splice(index, 1);
      saveStorage();
    }
  };

  addBtn.onclick = () => {
    const name = streamNameInput.value.trim() || "Stream " + (storage.length + 1);
    let targetUrl = urlInput.value.trim();

    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      targetUrl = URL.createObjectURL(file);
    }

    if (!targetUrl) {
      alert("გთხოვთ აირჩიოთ MP4 ფაილი ან ჩასვათ პირდაპირი URL ბმული!");
      return;
    }

    const newItem = {
      id: "id_" + Date.now(),
      name: name,
      url: targetUrl,
      date: new Date().toLocaleDateString("ka-GE")
    };

    storage.unshift(newItem);
    saveStorage();

    streamNameInput.value = "";
    urlInput.value = "";
    fileInput.value = "";
  };

  render();
})();
</script>
</body>
</html>
